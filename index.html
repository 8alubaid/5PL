@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

#predictor-root, #predictor-root * { box-sizing: border-box; }
#predictor-root {
  --bg: #07211a;
  --bg-deep: #051a14;
  --pitch-line: rgba(240,236,222,0.06);
  --green: #1f8a4c;
  --green-bright: #35c778;
  --gold: #d9a441;
  --gold-bright: #f0c25e;
  --text: #f3efe2;
  --text-dim: #9fbcae;
  --red: #e0574a;
  --card: #0c3527;
  --card-border: rgba(217,164,65,0.22);
  --radius: 16px;
  direction: rtl;
  font-family: 'Tajawal', sans-serif;
  color: var(--text);
  background:
    repeating-linear-gradient(180deg, transparent 0 39px, var(--pitch-line) 39px 40px),
    radial-gradient(ellipse at 50% -10%, #0d4a34 0%, var(--bg) 55%, var(--bg-deep) 100%);
  min-height: 100%;
  padding: 20px 14px 60px;
  line-height: 1.6;
}
#predictor-root h1, #predictor-root h2, #predictor-root h3, #predictor-root .disp {
  font-family: 'NT Panorama Naskh', serif;
  font-weight: 400;
}
.pr-wrap { max-width: 780px; margin: 0 auto; }
.pr-center-screen { min-height: 70vh; display:flex; align-items:center; justify-content:center; padding: 10px; }
.pr-login-card { width:100%; max-width: 480px; padding: 32px 26px; }
.pr-login-card .pr-title { font-size: 30px; margin-bottom: 22px !important; text-align:center; }
.pr-login-card .pr-tabs { margin-bottom: 22px; padding: 7px; }
.pr-login-card .pr-tab { padding: 16px 10px; font-size: 17px; border-radius: 12px; }
.pr-login-card .pr-label { font-size: 15px; margin-bottom: 8px; }
.pr-login-card .pr-input { padding: 15px 16px; font-size: 17px; border-radius: 12px; margin-bottom: 16px; }
.pr-login-card .pr-btn { width:100%; padding: 16px 20px; font-size: 17px; border-radius: 14px; }
.pr-login-card .pr-hint { font-size: 14px; margin-top: 10px; }
.pr-login-card .pr-error { font-size: 14px; }

/* Header */
.pr-header {
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-bottom: 22px; flex-wrap: wrap;
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  const SATEAMS = ["الهلال","النصر","الاتحاد","الأهلي","القادسية","الشباب","الفتح","الخليج","التعاون","أبها","نيوم","الفيحاء","الاتفاق","الحزم","الرياض","الدرعية","الخلود","الفيصلي"];
  const TEAM_AR = {
    "Al Hilal":"الهلال","Al-Hilal":"الهلال","Al Nassr":"النصر","Al-Nassr":"النصر",
    "Al Ittihad":"الاتحاد","Al-Ittihad":"الاتحاد","Al Ahli":"الأهلي","Al-Ahli":"الأهلي","Al Ahli Saudi":"الأهلي",
    "Al Qadsiah":"القادسية","Al-Qadsiah":"القادسية","Al Shabab":"الشباب","Al-Shabab":"الشباب",
    "Al Fateh":"الفتح","Al-Fateh":"الفتح","Al Khaleej":"الخليج","Al-Khaleej":"الخليج",
    "Al Raed":"الرائد","Al-Raed":"الرائد","Damac":"ضمك","Al Fayha":"الفيحاء","Al-Fayha":"الفيحاء",
    "Al Wehda":"الوحدة","Al-Wehda":"الوحدة","Al Taawoun":"التعاون","Al-Taawoun":"التعاون",
    "Abha":"أبها","Neom":"نيوم","Neom SC":"نيوم","Al Kholood":"الخلود","Al-Kholood":"الخلود",
    "Al Najma":"النجمة","Al-Najma":"النجمة","Al Ettifaq":"الاتفاق","Al-Ettifaq":"الاتفاق","Al Taee":"الطائي","Al-Taee":"الطائي"
  };
  let importStatus = '';
  const FIXED_TITLE = 'دوري الخيمة ٢٠٢٦\\٢٠٢٧';
  const FIXED_ADMIN_PIN = '13579';

  let config = null, players = [], rounds = [], predictions = {};
  let session = { playerId: null, playerName: null, isAdmin: false };
  let activeTab = 'predict';
  let selectedRoundId = null;
  let adminSubTab = 'rounds';
  let draftMatches = [];
  let draftRoundName = '';
  let loadError = false;

  const root = document.getElementById('pr-app');
  const uid = (p) => p + '_' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
  const esc = (s) => (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const AR_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  const toAr = (x) => String(x==null?'':x).replace(/[0-9]/g, d => AR_DIGITS[+d]);
  const toWest = (x) => String(x==null?'':x).replace(/[٠-٩]/g, d => String(AR_DIGITS.indexOf(d)));
  window.prDigitInput = function(el){ el.value = toAr(toWest(el.value).replace(/[^0-9]/g,'')); };

  // ===== ضع رابط نشر Google Apps Script هنا بعد النشر (خطوات النشر بالأسفل في الشات) =====
  const API_URL = 'https://script.google.com/macros/s/AKfycbxHbwswCzLV1LPdmwwJbk8ZorW_wDAUxanPe7F41WbkCQubmzunAPEXNdLJ-LqZ44CK/exec';

  let lastStorageError = '';
  async function sGet(key){
    try {
      const res = await fetch(API_URL + '?key=' + encodeURIComponent(key));
      const data = await res.json();
      return data && data.value ? JSON.parse(data.value) : null;
    } catch(e){ lastStorageError = (e && e.message) ? e.message : String(e); return null; }
  }
  async function sSet(key, value){
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ key, value: JSON.stringify(value) })
      });
      const data = await res.json();
      return !!(data && data.ok);
    } catch(e){ lastStorageError = (e && e.message) ? e.message : String(e); return false; }
  }

  async function loadAll(){
    try{
      const [c,p,r,pr] = await Promise.all([sGet('config'), sGet('players'), sGet('rounds'), sGet('predictions')]);
      config = c || { title: FIXED_TITLE, adminPin: FIXED_ADMIN_PIN, pointsExact: 3, pointsWinner: 1 };
      if(!c) await sSet('config', config);
      players = p || []; rounds = r || []; predictions = pr || {};
      loadError = false;
    }catch(e){ loadError = true; }
  }

  function findOpenRoundId(){
    for(let i = rounds.length - 1; i >= 0; i--){
      if(rounds[i].matches.some(m => !m.finished)) return rounds[i].id;
    }
    return rounds.length ? rounds[rounds.length-1].id : null;
  }

  function earliestKickoff(rnd){
    const times = rnd.matches.filter(m => m.kickoff).map(m => new Date(m.kickoff).getTime());
    return times.length ? Math.min(...times) : null;
  }
  function isRoundLocked(rnd){
    const first = earliestKickoff(rnd);
    if(first == null) return false;
    return new Date().getTime() >= first;
  }

  function matchOutcome(m){
    if(m.homeScore === m.awayScore) return 'draw';
    return m.homeScore > m.awayScore ? 'home' : 'away';
  }
  function calcRoundScore(playerId, rnd){
    const preds = predictions[playerId] || {};
    let correctCount = 0, exactBonus = 0, anyFinished = false;
    rnd.matches.forEach(m => {
      if(!m.finished || m.homeScore == null || m.awayScore == null) return;
      anyFinished = true;
      const pred = preds[m.id];
      if(!pred) return;
      const real = matchOutcome(m);
      if(pred.outcome === real) correctCount++;
      if(pred.exact && pred.exact.home !== '' && pred.exact.home != null && pred.exact.away !== '' && pred.exact.away != null){
        if(Number(pred.exact.home) === m.homeScore && Number(pred.exact.away) === m.awayScore) exactBonus += 1;
      }
    });
    let tierPoints = 0;
    if(correctCount >= 8) tierPoints = 5;
    else if(correctCount >= 5) tierPoints = 3;
    return { total: tierPoints + exactBonus, correctCount, tierPoints, exactBonus, anyFinished };
  }

  function computeStandings(){
    return players.map(pl => {
      let total = 0, exactBonusTotal = 0, roundTotals = {};
      rounds.forEach(rnd => {
        const r = calcRoundScore(pl.id, rnd);
        total += r.total; exactBonusTotal += r.exactBonus;
        roundTotals[rnd.id] = r.total;
      });
      let bestRound = null, bestVal = -1;
      rounds.forEach(rnd => { if(roundTotals[rnd.id] > bestVal){ bestVal = roundTotals[rnd.id]; bestRound = rnd.name; } });
      return { player: pl, total, exactBonusTotal, bestRound: bestRound || '—', bestVal: bestVal < 0 ? 0 : bestVal };
    }).sort((a,b) => b.total - a.total);
  }

  function fmtDT(iso){
    if(!iso) return '—';
    const d = new Date(iso);
    return toAr(d.toLocaleString('ar-SA', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }));
  }

  // ---------- RENDER ----------
  function render(){
    if(!storageHealthy){
      root.innerHTML = `<div class="pr-center-screen"><div class="pr-card" style="max-width:440px;text-align:center">
        <div class="pr-section-title" style="justify-content:center">⚠️ التخزين غير مربوط</div>
        <div class="pr-hint" style="margin-bottom:14px">لازم تربط الموقع بجدول Google Sheets أول (خطوة تسويها مرة وحدة بس) — رابط الـ Apps Script لسا ما انحط بالكود، أو الرابط المحطوط ما يشتغل.</div>
        ${lastStorageError ? `<div class="pr-hint" style="margin-bottom:14px;direction:ltr;text-align:left;background:rgba(0,0,0,0.25);padding:8px;border-radius:8px;font-size:11px;word-break:break-all">${esc(lastStorageError)}</div>` : ''}
        <button class="pr-btn" onclick="prBoot()">إعادة المحاولة</button>
      </div></div>`;
      return;
    }
    if(loadError){
      root.innerHTML = `<div class="pr-center-screen"><div style="text-align:center">
        <div style="margin-bottom:10px">تعذّر تحميل البيانات.</div>
        <button class="pr-btn" onclick="prBoot()">إعادة المحاولة</button>
      </div></div>`;
      return;
    }
    if(!session.playerId && !session.isAdmin){ renderLogin(); return; }
    renderApp();
  }

  function renderLogin(){
    root.innerHTML = `
      <div class="pr-center-screen"><div class="pr-card pr-login-card">
        <div class="pr-title">${toAr(esc(config.title))} 🏆</div>
        <div class="pr-tabs">
          <button class="pr-tab ${loginMode!=='admin'?'active':''}" onclick="prSetLoginMode('player')">لاعب</button>
          <button class="pr-tab ${loginMode==='admin'?'active':''}" onclick="prSetLoginMode('admin')">المنظم</button>
        </div>
        <div id="login-body"></div>
        <div id="login-err" class="pr-error"></div>
      </div></div>`;
    renderLoginBody();
  }
  let loginMode = 'player';
  window.prSetLoginMode = function(m){ loginMode = m; renderLogin(); };
  function renderLoginBody(){
    const body = document.getElementById('login-body');
    if(loginMode === 'admin'){
      body.innerHTML = `
        <label class="pr-label">الرمز السري للمنظم</label>
        <input class="pr-input" id="lg-pin" type="password" inputmode="numeric">
        <button class="pr-btn" onclick="prAdminLogin()">دخول لوحة التحكم</button>`;
    } else {
      body.innerHTML = `
        <label class="pr-label">بريدك الإلكتروني</label>
        <input class="pr-input" id="lg-email" type="email" placeholder="الإيميل اللي سجّلك فيه المنظم">
        <label class="pr-label">الرمز السري الخاص فيك</label>
        <input class="pr-input" id="lg-pin" type="password" inputmode="numeric" placeholder="الرمز اللي عطاك إياه المنظم">
        <button class="pr-btn" onclick="prPlayerLogin()">دخول</button>`;
    }
  }
  function saveSession(){
    try { localStorage.setItem('pr_session', JSON.stringify(session)); } catch(e){}
  }
  function loadSession(){
    try {
      const raw = localStorage.getItem('pr_session');
      if(!raw) return null;
      return JSON.parse(raw);
    } catch(e){ return null; }
  }
  function clearSession(){
    try { localStorage.removeItem('pr_session'); } catch(e){}
  }
  window.prAdminLogin = function(){
    const pin = document.getElementById('lg-pin').value.trim();
    if(pin === config.adminPin){ session.isAdmin = true; activeTab = 'admin'; saveSession(); render(); }
    else document.getElementById('login-err').textContent = 'الرمز غير صحيح.';
  };
  window.prPlayerLogin = async function(){
    const email = document.getElementById('lg-email').value.trim().toLowerCase();
    const pin = document.getElementById('lg-pin').value.trim();
    if(!email || !pin){ document.getElementById('login-err').textContent = 'عبّي الإيميل والرمز السري.'; return; }
    const existing = players.find(p => (p.email || '').trim().toLowerCase() === email);
    if(!existing){ document.getElementById('login-err').textContent = 'هذا الإيميل غير مسجل — خلّي المنظم يضيفك من لوحة التحكم.'; return; }
    if((existing.pin || '') !== pin){ document.getElementById('login-err').textContent = 'الرمز السري غير صحيح.'; return; }
    if(existing.suspended){ document.getElementById('login-err').textContent = 'حسابك موقوف مؤقتًا من المنظم — تواصل معه.'; return; }
    session.playerId = existing.id; session.playerName = existing.name;
    activeTab = 'predict';
    saveSession();
    render();
  };

  function renderApp(){
    const badgeName = session.isAdmin ? 'المنظم' : session.playerName;
    root.innerHTML = `
      <div class="pr-header">
        <div class="pr-title">${toAr(esc(config.title))} 🏆<small>توقعات الدوري السعودي بينك وبين خوياك</small></div>
        <div class="pr-user-badge"><b>${esc(badgeName)}</b> 👤 <button class="pr-logout" onclick="prLogout()">خروج</button></div>
      </div>
      <div class="pr-tabs" id="pr-tabs"></div>
      <div id="pr-content"></div>
    `;
    const tabsEl = document.getElementById('pr-tabs');
    const tabs = session.isAdmin
      ? [['admin','لوحة التحكم'],['leaderboard','الترتيب'],['history','الجولات']]
      : [['predict','التوقعات'],['leaderboard','الترتيب'],['history','السابقة']];
    tabsEl.innerHTML = tabs.map(([k,l]) => `<button class="pr-tab ${activeTab===k?'active':''}" onclick="prSetTab('${k}')">${l}</button>`).join('');
    const content = document.getElementById('pr-content');
    if(activeTab === 'predict') content.innerHTML = renderPredictTab();
    else if(activeTab === 'leaderboard') content.innerHTML = renderLeaderboardTab();
    else if(activeTab === 'history') content.innerHTML = renderHistoryTab();
    else if(activeTab === 'admin') renderAdminTab(content);
  }
  window.prSetTab = function(t){ activeTab = t; if(t !== 'admin') selectedRoundId = selectedRoundId || findOpenRoundId(); render(); };
  window.prLogout = function(){ session = { playerId:null, playerName:null, isAdmin:false }; loginMode='player'; clearSession(); render(); };

  let predictDraft = {};
  function initDraft(rnd){
    predictDraft = {};
    const myPreds = predictions[session.playerId] || {};
    rnd.matches.forEach(m => {
      const p = myPreds[m.id];
      predictDraft[m.id] = {
        outcome: p ? p.outcome || null : null,
        isExact: !!(p && p.exact),
        exactHome: p && p.exact ? p.exact.home : '',
        exactAway: p && p.exact ? p.exact.away : ''
      };
    });
  }
  function outcomeLabel(side, m){
    if(side === 'draw') return 'تعادل';
    return side === 'home' ? esc(m.home) : esc(m.away);
  }

  function renderPredictTab(){
    if(!rounds.length) return `<div class="pr-card"><div class="pr-empty">ما فيه جولات بعد — انتظر المنظم يضيف الجولة الأولى.</div></div>`;
    if(!selectedRoundId) selectedRoundId = findOpenRoundId();
    const roundChips = rounds.map(r => `<button class="pr-round-chip ${r.id===selectedRoundId?'active':''}" onclick="prSelectRound('${r.id}')">${toAr(esc(r.name))}</button>`).join('');
    const rnd = rounds.find(r => r.id === selectedRoundId) || rounds[0];
    const locked = isRoundLocked(rnd);

    if(locked){
      const rows = rnd.matches.map(m => {
        const allPicks = players.map(pl => {
          const pred = (predictions[pl.id] || {})[m.id];
          const isMe = pl.id === session.playerId;
          let txt = '—';
          if(pred && pred.outcome){
            txt = outcomeLabel(pred.outcome, m);
            if(pred.exact && pred.exact.home !== '' && pred.exact.home != null){
              txt += ` (🎯 ${toAr(pred.exact.home)}-${toAr(pred.exact.away)})`;
            }
          }
          return `<span style="display:inline-block;margin:3px 6px 3px 0;padding:3px 9px;border-radius:999px;font-size:12px;background:${isMe?'rgba(217,164,65,0.25)':'rgba(255,255,255,0.06)'};color:${isMe?'var(--gold-bright)':'var(--text-dim)'}">${esc(pl.name)}: ${txt}</span>`;
        }).join('');
        const realTxt = m.finished ? `${toAr(m.homeScore)} - ${toAr(m.awayScore)}` : '';
        return `<div style="padding:12px 6px;border-bottom:1px dashed rgba(255,255,255,0.08)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <b>${esc(m.home)} × ${esc(m.away)}</b>
            <span class="pr-match-time">${m.finished ? 'النتيجة: '+realTxt : fmtDT(m.kickoff)}</span>
          </div>
          <div>${allPicks || '<span class="pr-hint">محد توقع بعد</span>'}</div>
        </div>`;
      }).join('');
      const myScore = calcRoundScore(session.playerId, rnd);
      return `
        <div class="pr-round-select">${roundChips}</div>
        <div class="pr-card">
          <div class="pr-section-title">توقعات ${toAr(esc(rnd.name))} 🔒</div>
          <div class="pr-hint" style="margin-bottom:10px">الجولة بدأت — التوقعات مقفلة وظاهرة للجميع. نقاطك بهذي الجولة لحد الآن: <b style="color:var(--gold-bright)">${toAr(myScore.total)}</b> (${toAr(myScore.correctCount)}/${toAr(9)} صحيحة${myScore.exactBonus?` + ${toAr(myScore.exactBonus)} بونص دقيق`:''})</div>
          ${rows}
        </div>`;
    }

    if(!predictDraftRoundId || predictDraftRoundId !== rnd.id){ initDraft(rnd); predictDraftRoundId = rnd.id; }

    const rows = rnd.matches.map(m => {
      const d = predictDraft[m.id] || { outcome:null, isExact:false, exactHome:'', exactAway:'' };
      const btn = (side, label) => `<button type="button" class="pr-outcome-btn ${d.outcome===side?'active':''}" onclick="prPickOutcome('${m.id}','${side}')">${label}</button>`;
      return `
      <div class="pr-match-predict">
        <div class="pr-flex-between" style="margin-bottom:8px">
          <b>${esc(m.home)} × ${esc(m.away)}</b>
          <span class="pr-match-time">${fmtDT(m.kickoff)}</span>
        </div>
        <div class="pr-outcome-row">
          ${btn('home', esc(m.home))}
          ${btn('draw', 'تعادل')}
          ${btn('away', esc(m.away))}
        </div>
        <label class="pr-exact-toggle">
          <input type="checkbox" ${d.isExact?'checked':''} onchange="prToggleExact('${m.id}', this.checked)">
          🎯 اختر هذي كمباراة النتيجة الدقيقة (نقطة بونص إضافية)
        </label>
        ${d.isExact ? `
        <div class="pr-score-box" style="margin-top:8px">
          <input type="text" inputmode="numeric" maxlength="2" value="${toAr(d.exactHome)}" oninput="prDigitInput(this); prSetExactVal('${m.id}','home',this.value)">
          <span class="pr-score-dash">–</span>
          <input type="text" inputmode="numeric" maxlength="2" value="${toAr(d.exactAway)}" oninput="prDigitInput(this); prSetExactVal('${m.id}','away',this.value)">
        </div>` : ''}
      </div>`;
    }).join('');
    return `
      <div class="pr-round-select">${roundChips}</div>
      <div class="pr-card">
        <div class="pr-section-title">مباريات ${toAr(esc(rnd.name))}</div>
        <div class="pr-hint" style="margin-bottom:10px">اختر فوز/تعادل/خسارة لكل مباراة. ٥ صحيحة أو أكثر = ٣ نقاط، ٨ أو أكثر = ٥ نقاط. اختر مباراة وحدة بس تكتب لها نتيجة دقيقة (بونص +١ منفصل). توقعاتك سرّية لين تبدأ أول مباراة بالجولة.</div>
        ${rows}
        <div style="margin-top:14px;display:flex;justify-content:flex-end">
          <button class="pr-btn" onclick="prSavePredictions('${rnd.id}')">حفظ التوقعات 💾</button>
        </div>
        <div id="predict-msg" class="pr-hint"></div>
      </div>`;
  }
  let predictDraftRoundId = null;
  window.prSelectRound = function(id){ selectedRoundId = id; predictDraftRoundId = null; render(); };
  window.prPickOutcome = function(matchId, side){
    if(!predictDraft[matchId]) predictDraft[matchId] = { outcome:null, isExact:false, exactHome:'', exactAway:'' };
    predictDraft[matchId].outcome = side;
    render();
  };
  window.prToggleExact = function(matchId, checked){
    if(checked){
      // only one match per round can be the exact pick — clear others
      Object.keys(predictDraft).forEach(id => { predictDraft[id].isExact = false; });
      predictDraft[matchId].isExact = true;
    } else {
      predictDraft[matchId].isExact = false;
    }
    render();
  };
  window.prSetExactVal = function(matchId, side, val){
    if(!predictDraft[matchId]) return;
    predictDraft[matchId][side === 'home' ? 'exactHome' : 'exactAway'] = toWest(val);
  };
  window.prSavePredictions = async function(roundId){
    const rnd = rounds.find(r => r.id === roundId);
    if(isRoundLocked(rnd)){ prToast('الجولة بدأت وانقفلت التوقعات', true); render(); return; }
    const missing = rnd.matches.some(m => !predictDraft[m.id] || !predictDraft[m.id].outcome);
    if(missing){ document.getElementById('predict-msg').textContent = 'اختر فوز/تعادل/خسارة لكل مباراة قبل الحفظ.'; return; }
    const mine = predictions[session.playerId] ? {...predictions[session.playerId]} : {};
    rnd.matches.forEach(m => {
      const d = predictDraft[m.id];
      const hasExact = d.isExact && d.exactHome !== '' && d.exactHome != null && d.exactAway !== '' && d.exactAway != null;
      mine[m.id] = {
        outcome: d.outcome,
        exact: hasExact ? { home: Number(d.exactHome), away: Number(d.exactAway) } : null
      };
    });
    predictions[session.playerId] = mine;
    const ok = await sSet('predictions', predictions);
    document.getElementById('predict-msg').textContent = ok ? 'تم حفظ توقعاتك ✅' : 'صار خطأ أثناء الحفظ، حاول مرة ثانية ⚠️';
  };

  function renderLeaderboardTab(){
    if(!players.length) return `<div class="pr-card"><div class="pr-empty">ما فيه لاعبين مسجلين بعد.</div></div>`;
    const standings = computeStandings();
    const medals = ['🥇','🥈','🥉'];
    const rows = standings.map((s,i) => `
      <tr class="${s.player.id===session.playerId?'pr-row-me':''}">
        <td class="pr-rank">${medals[i] || toAr(i+1)}</td>
        <td>${esc(s.player.name)}</td>
        <td class="pr-total">${toAr(s.total)}</td>
        <td>${toAr(s.exactBonusTotal)}</td>
        <td>${toAr(esc(s.bestRound))} (${toAr(s.bestVal)})</td>
      </tr>`).join('');
    return `<div class="pr-card">
      <div class="pr-section-title">🏅 الترتيب العام</div>
      <div style="overflow-x:auto"><table class="pr-table">
        <thead><tr><th></th><th>اللاعب</th><th>المجموع</th><th>بونص دقيق 🎯</th><th>أفضل جولة</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }

  function renderHistoryTab(){
    if(!rounds.length) return `<div class="pr-card"><div class="pr-empty">ما فيه جولات بعد.</div></div>`;
    return rounds.slice().reverse().map(rnd => {
      const myPreds = predictions[session.playerId] || {};
      const score = calcRoundScore(session.playerId, rnd);
      const rows = rnd.matches.map(m => {
        const pred = myPreds[m.id];
        const real = m.finished ? matchOutcome(m) : null;
        const realTxt = m.finished ? `${toAr(m.homeScore)} - ${toAr(m.awayScore)}` : 'لم تنتهِ بعد';
        const predTxt = pred && pred.outcome ? outcomeLabel(pred.outcome, m) : 'لا يوجد توقع';
        const correct = m.finished && pred && pred.outcome === real;
        const exactTxt = pred && pred.exact ? ` 🎯 ${toAr(pred.exact.home)}-${toAr(pred.exact.away)}` : '';
        const exactHit = m.finished && pred && pred.exact && Number(pred.exact.home) === m.homeScore && Number(pred.exact.away) === m.awayScore;
        const pill = !m.finished ? '' : correct ? `<span class="pr-pts-pill pr-pts-3">✅</span>` : `<span class="pr-pts-pill pr-pts-0">❌</span>`;
        const exactPill = exactHit ? `<span class="pr-pts-pill pr-pts-1">🎯 +١</span>` : '';
        return `<div class="pr-match" style="flex-wrap:wrap">
          <div style="flex:1;min-width:140px"><b>${esc(m.home)} × ${esc(m.away)}</b><div class="pr-match-time">النتيجة: ${realTxt}</div></div>
          <div style="text-align:left"><div class="pr-match-time">توقعك: ${predTxt}${exactTxt}</div>${pill}${exactPill}</div>
        </div>`;
      }).join('');
      return `<div class="pr-card">
        <div class="pr-flex-between"><div class="pr-section-title">${toAr(esc(rnd.name))}</div>
        <span style="color:var(--gold-bright);font-weight:700">${toAr(score.total)} نقطة</span></div>
        ${rows}
      </div>`;
    }).join('');
  }

@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

#predictor-root, #predictor-root * { box-sizing: border-box; }
#predictor-root {
  --bg: #07211a;
  --bg-deep: #051a14;
  --pitch-line: rgba(240,236,222,0.06);
  --green: #1f8a4c;
  --green-bright: #35c778;
  --gold: #d9a441;
  --gold-bright: #f0c25e;
  --text: #f3efe2;
  --text-dim: #9fbcae;
  --red: #e0574a;
  --card: #0c3527;
  --card-border: rgba(217,164,65,0.22);
  --radius: 16px;
  direction: rtl;
  font-family: 'Tajawal', sans-serif;
  color: var(--text);
  background:
    repeating-linear-gradient(180deg, transparent 0 39px, var(--pitch-line) 39px 40px),
    radial-gradient(ellipse at 50% -10%, #0d4a34 0%, var(--bg) 55%, var(--bg-deep) 100%);
  min-height: 100%;
  padding: 20px 14px 60px;
  line-height: 1.6;
}
#predictor-root h1, #predictor-root h2, #predictor-root h3, #predictor-root .disp {
  font-family: 'NT Panorama Naskh', serif;
  font-weight: 400;
}
.pr-wrap { max-width: 780px; margin: 0 auto; }
.pr-center-screen { min-height: 70vh; display:flex; align-items:center; justify-content:center; padding: 10px; }
.pr-login-card { width:100%; max-width: 480px; padding: 32px 26px; }
.pr-login-card .pr-title { font-size: 30px; margin-bottom: 22px !important; text-align:center; }
.pr-login-card .pr-tabs { margin-bottom: 22px; padding: 7px; }
.pr-login-card .pr-tab { padding: 16px 10px; font-size: 17px; border-radius: 12px; }
.pr-login-card .pr-label { font-size: 15px; margin-bottom: 8px; }
.pr-login-card .pr-input { padding: 15px 16px; font-size: 17px; border-radius: 12px; margin-bottom: 16px; }
.pr-login-card .pr-btn { width:100%; padding: 16px 20px; font-size: 17px; border-radius: 14px; }
.pr-login-card .pr-hint { font-size: 14px; margin-top: 10px; }
.pr-login-card .pr-error { font-size: 14px; }

/* Header */
.pr-header {
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-bottom: 22px; flex-wrap: wrap;
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  const SATEAMS = ["الهلال","النصر","الاتحاد","الأهلي","القادسية","الشباب","الفتح","الخليج","التعاون","أبها","نيوم","الفيحاء","الاتفاق","الحزم","الرياض","الدرعية","الخلود","الفيصلي"];
  const TEAM_AR = {
    "Al Hilal":"الهلال","Al-Hilal":"الهلال","Al Nassr":"النصر","Al-Nassr":"النصر",
    "Al Ittihad":"الاتحاد","Al-Ittihad":"الاتحاد","Al Ahli":"الأهلي","Al-Ahli":"الأهلي","Al Ahli Saudi":"الأهلي",
    "Al Qadsiah":"القادسية","Al-Qadsiah":"القادسية","Al Shabab":"الشباب","Al-Shabab":"الشباب",
    "Al Fateh":"الفتح","Al-Fateh":"الفتح","Al Khaleej":"الخليج","Al-Khaleej":"الخليج",
    "Al Raed":"الرائد","Al-Raed":"الرائد","Damac":"ضمك","Al Fayha":"الفيحاء","Al-Fayha":"الفيحاء",
    "Al Wehda":"الوحدة","Al-Wehda":"الوحدة","Al Taawoun":"التعاون","Al-Taawoun":"التعاون",
    "Abha":"أبها","Neom":"نيوم","Neom SC":"نيوم","Al Kholood":"الخلود","Al-Kholood":"الخلود",
    "Al Najma":"النجمة","Al-Najma":"النجمة","Al Ettifaq":"الاتفاق","Al-Ettifaq":"الاتفاق","Al Taee":"الطائي","Al-Taee":"الطائي"
  };
  let importStatus = '';
  const FIXED_TITLE = 'دوري الخيمة ٢٠٢٦\\٢٠٢٧';
  const FIXED_ADMIN_PIN = '13579';

  let config = null, players = [], rounds = [], predictions = {};
  let session = { playerId: null, playerName: null, isAdmin: false };
  let activeTab = 'predict';
  let selectedRoundId = null;
  let adminSubTab = 'rounds';
  let draftMatches = [];
  let draftRoundName = '';
  let loadError = false;

  const root = document.getElementById('pr-app');
  const uid = (p) => p + '_' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
  const esc = (s) => (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const AR_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  const toAr = (x) => String(x==null?'':x).replace(/[0-9]/g, d => AR_DIGITS[+d]);
  const toWest = (x) => String(x==null?'':x).replace(/[٠-٩]/g, d => String(AR_DIGITS.indexOf(d)));
  window.prDigitInput = function(el){ el.value = toAr(toWest(el.value).replace(/[^0-9]/g,'')); };

  // ===== ضع رابط نشر Google Apps Script هنا بعد النشر (خطوات النشر بالأسفل في الشات) =====
  const API_URL = 'https://script.google.com/macros/s/AKfycbxHbwswCzLV1LPdmwwJbk8ZorW_wDAUxanPe7F41WbkCQubmzunAPEXNdLJ-LqZ44CK/exec';

  let lastStorageError = '';
  async function sGet(key){
    try {
      const res = await fetch(API_URL + '?key=' + encodeURIComponent(key));
      const data = await res.json();
      return data && data.value ? JSON.parse(data.value) : null;
    } catch(e){ lastStorageError = (e && e.message) ? e.message : String(e); return null; }
  }
  async function sSet(key, value){
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ key, value: JSON.stringify(value) })
      });
      const data = await res.json();
      return !!(data && data.ok);
    } catch(e){ lastStorageError = (e && e.message) ? e.message : String(e); return false; }
  }

  async function loadAll(){
    try{
      const [c,p,r,pr] = await Promise.all([sGet('config'), sGet('players'), sGet('rounds'), sGet('predictions')]);
      config = c || { title: FIXED_TITLE, adminPin: FIXED_ADMIN_PIN, pointsExact: 3, pointsWinner: 1 };
      if(!c) await sSet('config', config);
      players = p || []; rounds = r || []; predictions = pr || {};
      loadError = false;
    }catch(e){ loadError = true; }
  }

  function findOpenRoundId(){
    for(let i = rounds.length - 1; i >= 0; i--){
      if(rounds[i].matches.some(m => !m.finished)) return rounds[i].id;
    }
    return rounds.length ? rounds[rounds.length-1].id : null;
  }

  function earliestKickoff(rnd){
    const times = rnd.matches.filter(m => m.kickoff).map(m => new Date(m.kickoff).getTime());
    return times.length ? Math.min(...times) : null;
  }
  function isRoundLocked(rnd){
    const first = earliestKickoff(rnd);
    if(first == null) return false;
    return new Date().getTime() >= first;
  }

  function matchOutcome(m){
    if(m.homeScore === m.awayScore) return 'draw';
    return m.homeScore > m.awayScore ? 'home' : 'away';
  }
  function calcRoundScore(playerId, rnd){
    const preds = predictions[playerId] || {};
    let correctCount = 0, exactBonus = 0, anyFinished = false;
    rnd.matches.forEach(m => {
      if(!m.finished || m.homeScore == null || m.awayScore == null) return;
      anyFinished = true;
      const pred = preds[m.id];
      if(!pred) return;
      const real = matchOutcome(m);
      if(pred.outcome === real) correctCount++;
      if(pred.exact && pred.exact.home !== '' && pred.exact.home != null && pred.exact.away !== '' && pred.exact.away != null){
        if(Number(pred.exact.home) === m.homeScore && Number(pred.exact.away) === m.awayScore) exactBonus += 1;
      }
    });
    let tierPoints = 0;
    if(correctCount >= 8) tierPoints = 5;
    else if(correctCount >= 5) tierPoints = 3;
    return { total: tierPoints + exactBonus, correctCount, tierPoints, exactBonus, anyFinished };
  }

  function computeStandings(){
    return players.map(pl => {
      let total = 0, exactBonusTotal = 0, roundTotals = {};
      rounds.forEach(rnd => {
        const r = calcRoundScore(pl.id, rnd);
        total += r.total; exactBonusTotal += r.exactBonus;
        roundTotals[rnd.id] = r.total;
      });
      let bestRound = null, bestVal = -1;
      rounds.forEach(rnd => { if(roundTotals[rnd.id] > bestVal){ bestVal = roundTotals[rnd.id]; bestRound = rnd.name; } });
      return { player: pl, total, exactBonusTotal, bestRound: bestRound || '—', bestVal: bestVal < 0 ? 0 : bestVal };
    }).sort((a,b) => b.total - a.total);
  }

  function fmtDT(iso){
    if(!iso) return '—';
    const d = new Date(iso);
    return toAr(d.toLocaleString('ar-SA', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }));
  }

  // ---------- RENDER ----------
  function render(){
    if(!storageHealthy){
      root.innerHTML = `<div class="pr-center-screen"><div class="pr-card" style="max-width:440px;text-align:center">
        <div class="pr-section-title" style="justify-content:center">⚠️ التخزين غير مربوط</div>
        <div class="pr-hint" style="margin-bottom:14px">لازم تربط الموقع بجدول Google Sheets أول (خطوة تسويها مرة وحدة بس) — رابط الـ Apps Script لسا ما انحط بالكود، أو الرابط المحطوط ما يشتغل.</div>
        ${lastStorageError ? `<div class="pr-hint" style="margin-bottom:14px;direction:ltr;text-align:left;background:rgba(0,0,0,0.25);padding:8px;border-radius:8px;font-size:11px;word-break:break-all">${esc(lastStorageError)}</div>` : ''}
        <button class="pr-btn" onclick="prBoot()">إعادة المحاولة</button>
      </div></div>`;
      return;
    }
    if(loadError){
      root.innerHTML = `<div class="pr-center-screen"><div style="text-align:center">
        <div style="margin-bottom:10px">تعذّر تحميل البيانات.</div>
        <button class="pr-btn" onclick="prBoot()">إعادة المحاولة</button>
      </div></div>`;
      return;
    }
    if(!session.playerId && !session.isAdmin){ renderLogin(); return; }
    renderApp();
  }

  function renderLogin(){
    root.innerHTML = `
      <div class="pr-center-screen"><div class="pr-card pr-login-card">
        <div class="pr-title">${toAr(esc(config.title))} 🏆</div>
        <div class="pr-tabs">
          <button class="pr-tab ${loginMode!=='admin'?'active':''}" onclick="prSetLoginMode('player')">لاعب</button>
          <button class="pr-tab ${loginMode==='admin'?'active':''}" onclick="prSetLoginMode('admin')">المنظم</button>
        </div>
        <div id="login-body"></div>
        <div id="login-err" class="pr-error"></div>
      </div></div>`;
    renderLoginBody();
  }
  let loginMode = 'player';
  window.prSetLoginMode = function(m){ loginMode = m; renderLogin(); };
  function renderLoginBody(){
    const body = document.getElementById('login-body');
    if(loginMode === 'admin'){
      body.innerHTML = `
        <label class="pr-label">الرمز السري للمنظم</label>
        <input class="pr-input" id="lg-pin" type="password" inputmode="numeric">
        <button class="pr-btn" onclick="prAdminLogin()">دخول لوحة التحكم</button>`;
    } else {
      body.innerHTML = `
        <label class="pr-label">بريدك الإلكتروني</label>
        <input class="pr-input" id="lg-email" type="email" placeholder="الإيميل اللي سجّلك فيه المنظم">
        <label class="pr-label">الرمز السري الخاص فيك</label>
        <input class="pr-input" id="lg-pin" type="password" inputmode="numeric" placeholder="الرمز اللي عطاك إياه المنظم">
        <button class="pr-btn" onclick="prPlayerLogin()">دخول</button>`;
    }
  }
  function saveSession(){
    try { localStorage.setItem('pr_session', JSON.stringify(session)); } catch(e){}
  }
  function loadSession(){
    try {
      const raw = localStorage.getItem('pr_session');
      if(!raw) return null;
      return JSON.parse(raw);
    } catch(e){ return null; }
  }
  function clearSession(){
    try { localStorage.removeItem('pr_session'); } catch(e){}
  }
  window.prAdminLogin = function(){
    const pin = document.getElementById('lg-pin').value.trim();
    if(pin === config.adminPin){ session.isAdmin = true; activeTab = 'admin'; saveSession(); render(); }
    else document.getElementById('login-err').textContent = 'الرمز غير صحيح.';
  };
  window.prPlayerLogin = async function(){
    const email = document.getElementById('lg-email').value.trim().toLowerCase();
    const pin = document.getElementById('lg-pin').value.trim();
    if(!email || !pin){ document.getElementById('login-err').textContent = 'عبّي الإيميل والرمز السري.'; return; }
    const existing = players.find(p => (p.email || '').trim().toLowerCase() === email);
    if(!existing){ document.getElementById('login-err').textContent = 'هذا الإيميل غير مسجل — خلّي المنظم يضيفك من لوحة التحكم.'; return; }
    if((existing.pin || '') !== pin){ document.getElementById('login-err').textContent = 'الرمز السري غير صحيح.'; return; }
    if(existing.suspended){ document.getElementById('login-err').textContent = 'حسابك موقوف مؤقتًا من المنظم — تواصل معه.'; return; }
    session.playerId = existing.id; session.playerName = existing.name;
    activeTab = 'predict';
    saveSession();
    render();
  };

  function renderApp(){
    const badgeName = session.isAdmin ? 'المنظم' : session.playerName;
    root.innerHTML = `
      <div class="pr-header">
        <div class="pr-title">${toAr(esc(config.title))} 🏆<small>توقعات الدوري السعودي بينك وبين خوياك</small></div>
        <div class="pr-user-badge"><b>${esc(badgeName)}</b> 👤 <button class="pr-logout" onclick="prLogout()">خروج</button></div>
      </div>
      <div class="pr-tabs" id="pr-tabs"></div>
      <div id="pr-content"></div>
    `;
    const tabsEl = document.getElementById('pr-tabs');
    const tabs = session.isAdmin
      ? [['admin','لوحة التحكم'],['leaderboard','الترتيب'],['history','الجولات']]
      : [['predict','التوقعات'],['leaderboard','الترتيب'],['history','السابقة']];
    tabsEl.innerHTML = tabs.map(([k,l]) => `<button class="pr-tab ${activeTab===k?'active':''}" onclick="prSetTab('${k}')">${l}</button>`).join('');
    const content = document.getElementById('pr-content');
    if(activeTab === 'predict') content.innerHTML = renderPredictTab();
    else if(activeTab === 'leaderboard') content.innerHTML = renderLeaderboardTab();
    else if(activeTab === 'history') content.innerHTML = renderHistoryTab();
    else if(activeTab === 'admin') renderAdminTab(content);
  }
  window.prSetTab = function(t){ activeTab = t; if(t !== 'admin') selectedRoundId = selectedRoundId || findOpenRoundId(); render(); };
  window.prLogout = function(){ session = { playerId:null, playerName:null, isAdmin:false }; loginMode='player'; clearSession(); render(); };

  let predictDraft = {};
  function initDraft(rnd){
    predictDraft = {};
    const myPreds = predictions[session.playerId] || {};
    rnd.matches.forEach(m => {
      const p = myPreds[m.id];
      predictDraft[m.id] = {
        outcome: p ? p.outcome || null : null,
        isExact: !!(p && p.exact),
        exactHome: p && p.exact ? p.exact.home : '',
        exactAway: p && p.exact ? p.exact.away : ''
      };
    });
  }
  function outcomeLabel(side, m){
    if(side === 'draw') return 'تعادل';
    return side === 'home' ? esc(m.home) : esc(m.away);
  }

  function renderPredictTab(){
    if(!rounds.length) return `<div class="pr-card"><div class="pr-empty">ما فيه جولات بعد — انتظر المنظم يضيف الجولة الأولى.</div></div>`;
    if(!selectedRoundId) selectedRoundId = findOpenRoundId();
    const roundChips = rounds.map(r => `<button class="pr-round-chip ${r.id===selectedRoundId?'active':''}" onclick="prSelectRound('${r.id}')">${toAr(esc(r.name))}</button>`).join('');
    const rnd = rounds.find(r => r.id === selectedRoundId) || rounds[0];
    const locked = isRoundLocked(rnd);

    if(locked){
      const rows = rnd.matches.map(m => {
        const allPicks = players.map(pl => {
          const pred = (predictions[pl.id] || {})[m.id];
          const isMe = pl.id === session.playerId;
          let txt = '—';
          if(pred && pred.outcome){
            txt = outcomeLabel(pred.outcome, m);
            if(pred.exact && pred.exact.home !== '' && pred.exact.home != null){
              txt += ` (🎯 ${toAr(pred.exact.home)}-${toAr(pred.exact.away)})`;
            }
          }
          return `<span style="display:inline-block;margin:3px 6px 3px 0;padding:3px 9px;border-radius:999px;font-size:12px;background:${isMe?'rgba(217,164,65,0.25)':'rgba(255,255,255,0.06)'};color:${isMe?'var(--gold-bright)':'var(--text-dim)'}">${esc(pl.name)}: ${txt}</span>`;
        }).join('');
        const realTxt = m.finished ? `${toAr(m.homeScore)} - ${toAr(m.awayScore)}` : '';
        return `<div style="padding:12px 6px;border-bottom:1px dashed rgba(255,255,255,0.08)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <b>${esc(m.home)} × ${esc(m.away)}</b>
            <span class="pr-match-time">${m.finished ? 'النتيجة: '+realTxt : fmtDT(m.kickoff)}</span>
          </div>
          <div>${allPicks || '<span class="pr-hint">محد توقع بعد</span>'}</div>
        </div>`;
      }).join('');
      const myScore = calcRoundScore(session.playerId, rnd);
      return `
        <div class="pr-round-select">${roundChips}</div>
        <div class="pr-card">
          <div class="pr-section-title">توقعات ${toAr(esc(rnd.name))} 🔒</div>
          <div class="pr-hint" style="margin-bottom:10px">الجولة بدأت — التوقعات مقفلة وظاهرة للجميع. نقاطك بهذي الجولة لحد الآن: <b style="color:var(--gold-bright)">${toAr(myScore.total)}</b> (${toAr(myScore.correctCount)}/${toAr(9)} صحيحة${myScore.exactBonus?` + ${toAr(myScore.exactBonus)} بونص دقيق`:''})</div>
          ${rows}
        </div>`;
    }

    if(!predictDraftRoundId || predictDraftRoundId !== rnd.id){ initDraft(rnd); predictDraftRoundId = rnd.id; }

    const rows = rnd.matches.map(m => {
      const d = predictDraft[m.id] || { outcome:null, isExact:false, exactHome:'', exactAway:'' };
      const btn = (side, label) => `<button type="button" class="pr-outcome-btn ${d.outcome===side?'active':''}" onclick="prPickOutcome('${m.id}','${side}')">${label}</button>`;
      return `
      <div class="pr-match-predict">
        <div class="pr-flex-between" style="margin-bottom:8px">
          <b>${esc(m.home)} × ${esc(m.away)}</b>
          <span class="pr-match-time">${fmtDT(m.kickoff)}</span>
        </div>
        <div class="pr-outcome-row">
          ${btn('home', esc(m.home))}
          ${btn('draw', 'تعادل')}
          ${btn('away', esc(m.away))}
        </div>
        <label class="pr-exact-toggle">
          <input type="checkbox" ${d.isExact?'checked':''} onchange="prToggleExact('${m.id}', this.checked)">
          🎯 اختر هذي كمباراة النتيجة الدقيقة (نقطة بونص إضافية)
        </label>
        ${d.isExact ? `
        <div class="pr-score-box" style="margin-top:8px">
          <input type="text" inputmode="numeric" maxlength="2" value="${toAr(d.exactHome)}" oninput="prDigitInput(this); prSetExactVal('${m.id}','home',this.value)">
          <span class="pr-score-dash">–</span>
          <input type="text" inputmode="numeric" maxlength="2" value="${toAr(d.exactAway)}" oninput="prDigitInput(this); prSetExactVal('${m.id}','away',this.value)">
        </div>` : ''}
      </div>`;
    }).join('');
    return `
      <div class="pr-round-select">${roundChips}</div>
      <div class="pr-card">
        <div class="pr-section-title">مباريات ${toAr(esc(rnd.name))}</div>
        <div class="pr-hint" style="margin-bottom:10px">اختر فوز/تعادل/خسارة لكل مباراة. ٥ صحيحة أو أكثر = ٣ نقاط، ٨ أو أكثر = ٥ نقاط. اختر مباراة وحدة بس تكتب لها نتيجة دقيقة (بونص +١ منفصل). توقعاتك سرّية لين تبدأ أول مباراة بالجولة.</div>
        ${rows}
        <div style="margin-top:14px;display:flex;justify-content:flex-end">
          <button class="pr-btn" onclick="prSavePredictions('${rnd.id}')">حفظ التوقعات 💾</button>
        </div>
        <div id="predict-msg" class="pr-hint"></div>
      </div>`;
  }
  let predictDraftRoundId = null;
  window.prSelectRound = function(id){ selectedRoundId = id; predictDraftRoundId = null; render(); };
  window.prPickOutcome = function(matchId, side){
    if(!predictDraft[matchId]) predictDraft[matchId] = { outcome:null, isExact:false, exactHome:'', exactAway:'' };
    predictDraft[matchId].outcome = side;
    render();
  };
  window.prToggleExact = function(matchId, checked){
    if(checked){
      // only one match per round can be the exact pick — clear others
      Object.keys(predictDraft).forEach(id => { predictDraft[id].isExact = false; });
      predictDraft[matchId].isExact = true;
    } else {
      predictDraft[matchId].isExact = false;
    }
    render();
  };
  window.prSetExactVal = function(matchId, side, val){
    if(!predictDraft[matchId]) return;
    predictDraft[matchId][side === 'home' ? 'exactHome' : 'exactAway'] = toWest(val);
  };
  window.prSavePredictions = async function(roundId){
    const rnd = rounds.find(r => r.id === roundId);
    if(isRoundLocked(rnd)){ prToast('الجولة بدأت وانقفلت التوقعات', true); render(); return; }
    const missing = rnd.matches.some(m => !predictDraft[m.id] || !predictDraft[m.id].outcome);
    if(missing){ document.getElementById('predict-msg').textContent = 'اختر فوز/تعادل/خسارة لكل مباراة قبل الحفظ.'; return; }
    const mine = predictions[session.playerId] ? {...predictions[session.playerId]} : {};
    rnd.matches.forEach(m => {
      const d = predictDraft[m.id];
      const hasExact = d.isExact && d.exactHome !== '' && d.exactHome != null && d.exactAway !== '' && d.exactAway != null;
      mine[m.id] = {
        outcome: d.outcome,
        exact: hasExact ? { home: Number(d.exactHome), away: Number(d.exactAway) } : null
      };
    });
    predictions[session.playerId] = mine;
    const ok = await sSet('predictions', predictions);
    document.getElementById('predict-msg').textContent = ok ? 'تم حفظ توقعاتك ✅' : 'صار خطأ أثناء الحفظ، حاول مرة ثانية ⚠️';
  };

  function renderLeaderboardTab(){
    if(!players.length) return `<div class="pr-card"><div class="pr-empty">ما فيه لاعبين مسجلين بعد.</div></div>`;
    const standings = computeStandings();
    const medals = ['🥇','🥈','🥉'];
    const rows = standings.map((s,i) => `
      <tr class="${s.player.id===session.playerId?'pr-row-me':''}">
        <td class="pr-rank">${medals[i] || toAr(i+1)}</td>
        <td>${esc(s.player.name)}</td>
        <td class="pr-total">${toAr(s.total)}</td>
        <td>${toAr(s.exactBonusTotal)}</td>
        <td>${toAr(esc(s.bestRound))} (${toAr(s.bestVal)})</td>
      </tr>`).join('');
    return `<div class="pr-card">
      <div class="pr-section-title">🏅 الترتيب العام</div>
      <div style="overflow-x:auto"><table class="pr-table">
        <thead><tr><th></th><th>اللاعب</th><th>المجموع</th><th>بونص دقيق 🎯</th><th>أفضل جولة</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }

  function renderHistoryTab(){
    if(!rounds.length) return `<div class="pr-card"><div class="pr-empty">ما فيه جولات بعد.</div></div>`;
    return rounds.slice().reverse().map(rnd => {
      const myPreds = predictions[session.playerId] || {};
      const score = calcRoundScore(session.playerId, rnd);
      const rows = rnd.matches.map(m => {
        const pred = myPreds[m.id];
        const real = m.finished ? matchOutcome(m) : null;
        const realTxt = m.finished ? `${toAr(m.homeScore)} - ${toAr(m.awayScore)}` : 'لم تنتهِ بعد';
        const predTxt = pred && pred.outcome ? outcomeLabel(pred.outcome, m) : 'لا يوجد توقع';
        const correct = m.finished && pred && pred.outcome === real;
        const exactTxt = pred && pred.exact ? ` 🎯 ${toAr(pred.exact.home)}-${toAr(pred.exact.away)}` : '';
        const exactHit = m.finished && pred && pred.exact && Number(pred.exact.home) === m.homeScore && Number(pred.exact.away) === m.awayScore;
        const pill = !m.finished ? '' : correct ? `<span class="pr-pts-pill pr-pts-3">✅</span>` : `<span class="pr-pts-pill pr-pts-0">❌</span>`;
        const exactPill = exactHit ? `<span class="pr-pts-pill pr-pts-1">🎯 +١</span>` : '';
        return `<div class="pr-match" style="flex-wrap:wrap">
          <div style="flex:1;min-width:140px"><b>${esc(m.home)} × ${esc(m.away)}</b><div class="pr-match-time">النتيجة: ${realTxt}</div></div>
          <div style="text-align:left"><div class="pr-match-time">توقعك: ${predTxt}${exactTxt}</div>${pill}${exactPill}</div>
        </div>`;
      }).join('');
      return `<div class="pr-card">
        <div class="pr-flex-between"><div class="pr-section-title">${toAr(esc(rnd.name))}</div>
        <span style="color:var(--gold-bright);font-weight:700">${toAr(score.total)} نقطة</span></div>
        ${rows}
      </div>`;
    }).join('');
  }

@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

#predictor-root, #predictor-root * { box-sizing: border-box; }
#predictor-root {
  --bg: #07211a;
  --bg-deep: #051a14;
  --pitch-line: rgba(240,236,222,0.06);
  --green: #1f8a4c;
  --green-bright: #35c778;
  --gold: #d9a441;
  --gold-bright: #f0c25e;
  --text: #f3efe2;
  --text-dim: #9fbcae;
  --red: #e0574a;
  --card: #0c3527;
  --card-border: rgba(217,164,65,0.22);
  --radius: 16px;
  direction: rtl;
  font-family: 'Tajawal', sans-serif;
  color: var(--text);
  background:
    repeating-linear-gradient(180deg, transparent 0 39px, var(--pitch-line) 39px 40px),
    radial-gradient(ellipse at 50% -10%, #0d4a34 0%, var(--bg) 55%, var(--bg-deep) 100%);
  min-height: 100%;
  padding: 20px 14px 60px;
  line-height: 1.6;
}
#predictor-root h1, #predictor-root h2, #predictor-root h3, #predictor-root .disp {
  font-family: 'NT Panorama Naskh', serif;
  font-weight: 400;
}
.pr-wrap { max-width: 780px; margin: 0 auto; }
.pr-center-screen { min-height: 70vh; display:flex; align-items:center; justify-content:center; padding: 10px; }
.pr-login-card { width:100%; max-width: 480px; padding: 32px 26px; }
.pr-login-card .pr-title { font-size: 30px; margin-bottom: 22px !important; text-align:center; }
.pr-login-card .pr-tabs { margin-bottom: 22px; padding: 7px; }
.pr-login-card .pr-tab { padding: 16px 10px; font-size: 17px; border-radius: 12px; }
.pr-login-card .pr-label { font-size: 15px; margin-bottom: 8px; }
.pr-login-card .pr-input { padding: 15px 16px; font-size: 17px; border-radius: 12px; margin-bottom: 16px; }
.pr-login-card .pr-btn { width:100%; padding: 16px 20px; font-size: 17px; border-radius: 14px; }
.pr-login-card .pr-hint { font-size: 14px; margin-top: 10px; }
.pr-login-card .pr-error { font-size: 14px; }

/* Header */
.pr-header {
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-bottom: 22px; flex-wrap: wrap;
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
  const SATEAMS = ["الهلال","النصر","الاتحاد","الأهلي","القادسية","الشباب","الفتح","الخليج","التعاون","أبها","نيوم","الفيحاء","الاتفاق","الحزم","الرياض","الدرعية","الخلود","الفيصلي"];
  const TEAM_AR = {
    "Al Hilal":"الهلال","Al-Hilal":"الهلال","Al Nassr":"النصر","Al-Nassr":"النصر",
    "Al Ittihad":"الاتحاد","Al-Ittihad":"الاتحاد","Al Ahli":"الأهلي","Al-Ahli":"الأهلي","Al Ahli Saudi":"الأهلي",
    "Al Qadsiah":"القادسية","Al-Qadsiah":"القادسية","Al Shabab":"الشباب","Al-Shabab":"الشباب",
    "Al Fateh":"الفتح","Al-Fateh":"الفتح","Al Khaleej":"الخليج","Al-Khaleej":"الخليج",
    "Al Raed":"الرائد","Al-Raed":"الرائد","Damac":"ضمك","Al Fayha":"الفيحاء","Al-Fayha":"الفيحاء",
    "Al Wehda":"الوحدة","Al-Wehda":"الوحدة","Al Taawoun":"التعاون","Al-Taawoun":"التعاون",
    "Abha":"أبها","Neom":"نيوم","Neom SC":"نيوم","Al Kholood":"الخلود","Al-Kholood":"الخلود",
    "Al Najma":"النجمة","Al-Najma":"النجمة","Al Ettifaq":"الاتفاق","Al-Ettifaq":"الاتفاق","Al Taee":"الطائي","Al-Taee":"الطائي"
  };
  let importStatus = '';
  const FIXED_TITLE = 'دوري الخيمة ٢٠٢٦\\٢٠٢٧';
  const FIXED_ADMIN_PIN = '13579';

  let config = null, players = [], rounds = [], predictions = {};
  let session = { playerId: null, playerName: null, isAdmin: false };
  let activeTab = 'predict';
  let selectedRoundId = null;
  let adminSubTab = 'rounds';
  let draftMatches = [];
  let draftRoundName = '';
  let loadError = false;

  const root = document.getElementById('pr-app');
  const uid = (p) => p + '_' + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
  const esc = (s) => (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const AR_DIGITS = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  const toAr = (x) => String(x==null?'':x).replace(/[0-9]/g, d => AR_DIGITS[+d]);
  const toWest = (x) => String(x==null?'':x).replace(/[٠-٩]/g, d => String(AR_DIGITS.indexOf(d)));
  window.prDigitInput = function(el){ el.value = toAr(toWest(el.value).replace(/[^0-9]/g,'')); };

  // ===== ضع رابط نشر Google Apps Script هنا بعد النشر (خطوات النشر بالأسفل في الشات) =====
  const API_URL = 'https://script.google.com/macros/s/AKfycbxHbwswCzLV1LPdmwwJbk8ZorW_wDAUxanPe7F41WbkCQubmzunAPEXNdLJ-LqZ44CK/exec';

  let lastStorageError = '';
  async function sGet(key){
    try {
      const res = await fetch(API_URL + '?key=' + encodeURIComponent(key));
      const data = await res.json();
      return data && data.value ? JSON.parse(data.value) : null;
    } catch(e){ lastStorageError = (e && e.message) ? e.message : String(e); return null; }
  }
  async function sSet(key, value){
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ key, value: JSON.stringify(value) })
      });
      const data = await res.json();
      return !!(data && data.ok);
    } catch(e){ lastStorageError = (e && e.message) ? e.message : String(e); return false; }
  }

  async function loadAll(){
    try{
      const [c,p,r,pr] = await Promise.all([sGet('config'), sGet('players'), sGet('rounds'), sGet('predictions')]);
      config = c || { title: FIXED_TITLE, adminPin: FIXED_ADMIN_PIN, pointsExact: 3, pointsWinner: 1 };
      if(!c) await sSet('config', config);
      players = p || []; rounds = r || []; predictions = pr || {};
      loadError = false;
    }catch(e){ loadError = true; }
  }

  function findOpenRoundId(){
    for(let i = rounds.length - 1; i >= 0; i--){
      if(rounds[i].matches.some(m => !m.finished)) return rounds[i].id;
    }
    return rounds.length ? rounds[rounds.length-1].id : null;
  }

  function earliestKickoff(rnd){
    const times = rnd.matches.filter(m => m.kickoff).map(m => new Date(m.kickoff).getTime());
    return times.length ? Math.min(...times) : null;
  }
  function isRoundLocked(rnd){
    const first = earliestKickoff(rnd);
    if(first == null) return false;
    return new Date().getTime() >= first;
  }

  function matchOutcome(m){
    if(m.homeScore === m.awayScore) return 'draw';
    return m.homeScore > m.awayScore ? 'home' : 'away';
  }
  function calcRoundScore(playerId, rnd){
    const preds = predictions[playerId] || {};
    let correctCount = 0, exactBonus = 0, anyFinished = false;
    rnd.matches.forEach(m => {
      if(!m.finished || m.homeScore == null || m.awayScore == null) return;
      anyFinished = true;
      const pred = preds[m.id];
      if(!pred) return;
      const real = matchOutcome(m);
      if(pred.outcome === real) correctCount++;
      if(pred.exact && pred.exact.home !== '' && pred.exact.home != null && pred.exact.away !== '' && pred.exact.away != null){
        if(Number(pred.exact.home) === m.homeScore && Number(pred.exact.away) === m.awayScore) exactBonus += 1;
      }
    });
    let tierPoints = 0;
    if(correctCount >= 8) tierPoints = 5;
    else if(correctCount >= 5) tierPoints = 3;
    return { total: tierPoints + exactBonus, correctCount, tierPoints, exactBonus, anyFinished };
  }

  function computeStandings(){
    return players.map(pl => {
      let total = 0, exactBonusTotal = 0, roundTotals = {};
      rounds.forEach(rnd => {
        const r = calcRoundScore(pl.id, rnd);
        total += r.total; exactBonusTotal += r.exactBonus;
        roundTotals[rnd.id] = r.total;
      });
      let bestRound = null, bestVal = -1;
      rounds.forEach(rnd => { if(roundTotals[rnd.id] > bestVal){ bestVal = roundTotals[rnd.id]; bestRound = rnd.name; } });
      return { player: pl, total, exactBonusTotal, bestRound: bestRound || '—', bestVal: bestVal < 0 ? 0 : bestVal };
    }).sort((a,b) => b.total - a.total);
  }

  function fmtDT(iso){
    if(!iso) return '—';
    const d = new Date(iso);
    return toAr(d.toLocaleString('ar-SA', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }));
  }

  // ---------- RENDER ----------
  function render(){
    if(!storageHealthy){
      root.innerHTML = `<div class="pr-center-screen"><div class="pr-card" style="max-width:440px;text-align:center">
        <div class="pr-section-title" style="justify-content:center">⚠️ التخزين غير مربوط</div>
        <div class="pr-hint" style="margin-bottom:14px">لازم تربط الموقع بجدول Google Sheets أول (خطوة تسويها مرة وحدة بس) — رابط الـ Apps Script لسا ما انحط بالكود، أو الرابط المحطوط ما يشتغل.</div>
        ${lastStorageError ? `<div class="pr-hint" style="margin-bottom:14px;direction:ltr;text-align:left;background:rgba(0,0,0,0.25);padding:8px;border-radius:8px;font-size:11px;word-break:break-all">${esc(lastStorageError)}</div>` : ''}
        <button class="pr-btn" onclick="prBoot()">إعادة المحاولة</button>
      </div></div>`;
      return;
    }
    if(loadError){
      root.innerHTML = `<div class="pr-center-screen"><div style="text-align:center">
        <div style="margin-bottom:10px">تعذّر تحميل البيانات.</div>
        <button class="pr-btn" onclick="prBoot()">إعادة المحاولة</button>
      </div></div>`;
      return;
    }
    if(!session.playerId && !session.isAdmin){ renderLogin(); return; }
    renderApp();
  }

  function renderLogin(){
    root.innerHTML = `
      <div class="pr-center-screen"><div class="pr-card pr-login-card">
        <div class="pr-title">${toAr(esc(config.title))} 🏆</div>
        <div class="pr-tabs">
          <button class="pr-tab ${loginMode!=='admin'?'active':''}" onclick="prSetLoginMode('player')">لاعب</button>
          <button class="pr-tab ${loginMode==='admin'?'active':''}" onclick="prSetLoginMode('admin')">المنظم</button>
        </div>
        <div id="login-body"></div>
        <div id="login-err" class="pr-error"></div>
      </div></div>`;
    renderLoginBody();
  }
  let loginMode = 'player';
  window.prSetLoginMode = function(m){ loginMode = m; renderLogin(); };
  function renderLoginBody(){
    const body = document.getElementById('login-body');
    if(loginMode === 'admin'){
      body.innerHTML = `
        <label class="pr-label">الرمز السري للمنظم</label>
        <input class="pr-input" id="lg-pin" type="password" inputmode="numeric">
        <button class="pr-btn" onclick="prAdminLogin()">دخول لوحة التحكم</button>`;
    } else {
      body.innerHTML = `
        <label class="pr-label">بريدك الإلكتروني</label>
        <input class="pr-input" id="lg-email" type="email" placeholder="الإيميل اللي سجّلك فيه المنظم">
        <label class="pr-label">الرمز السري الخاص فيك</label>
        <input class="pr-input" id="lg-pin" type="password" inputmode="numeric" placeholder="الرمز اللي عطاك إياه المنظم">
        <button class="pr-btn" onclick="prPlayerLogin()">دخول</button>`;
    }
  }
  function saveSession(){
    try { localStorage.setItem('pr_session', JSON.stringify(session)); } catch(e){}
  }
  function loadSession(){
    try {
      const raw = localStorage.getItem('pr_session');
      if(!raw) return null;
      return JSON.parse(raw);
    } catch(e){ return null; }
  }
  function clearSession(){
    try { localStorage.removeItem('pr_session'); } catch(e){}
  }
  window.prAdminLogin = function(){
    const pin = document.getElementById('lg-pin').value.trim();
    if(pin === config.adminPin){ session.isAdmin = true; activeTab = 'admin'; saveSession(); render(); }
    else document.getElementById('login-err').textContent = 'الرمز غير صحيح.';
  };
  window.prPlayerLogin = async function(){
    const email = document.getElementById('lg-email').value.trim().toLowerCase();
    const pin = document.getElementById('lg-pin').value.trim();
    if(!email || !pin){ document.getElementById('login-err').textContent = 'عبّي الإيميل والرمز السري.'; return; }
    const existing = players.find(p => (p.email || '').trim().toLowerCase() === email);
    if(!existing){ document.getElementById('login-err').textContent = 'هذا الإيميل غير مسجل — خلّي المنظم يضيفك من لوحة التحكم.'; return; }
    if((existing.pin || '') !== pin){ document.getElementById('login-err').textContent = 'الرمز السري غير صحيح.'; return; }
    if(existing.suspended){ document.getElementById('login-err').textContent = 'حسابك موقوف مؤقتًا من المنظم — تواصل معه.'; return; }
    session.playerId = existing.id; session.playerName = existing.name;
    activeTab = 'predict';
    saveSession();
    render();
  };

  function renderApp(){
    const badgeName = session.isAdmin ? 'المنظم' : session.playerName;
    root.innerHTML = `
      <div class="pr-header">
        <div class="pr-title">${toAr(esc(config.title))} 🏆<small>توقعات الدوري السعودي بينك وبين خوياك</small></div>
        <div class="pr-user-badge"><b>${esc(badgeName)}</b> 👤 <button class="pr-logout" onclick="prLogout()">خروج</button></div>
      </div>
      <div class="pr-tabs" id="pr-tabs"></div>
      <div id="pr-content"></div>
    `;
    const tabsEl = document.getElementById('pr-tabs');
    const tabs = session.isAdmin
      ? [['admin','لوحة التحكم'],['leaderboard','الترتيب'],['history','الجولات']]
      : [['predict','التوقعات'],['leaderboard','الترتيب'],['history','السابقة']];
    tabsEl.innerHTML = tabs.map(([k,l]) => `<button class="pr-tab ${activeTab===k?'active':''}" onclick="prSetTab('${k}')">${l}</button>`).join('');
    const content = document.getElementById('pr-content');
    if(activeTab === 'predict') content.innerHTML = renderPredictTab();
    else if(activeTab === 'leaderboard') content.innerHTML = renderLeaderboardTab();
    else if(activeTab === 'history') content.innerHTML = renderHistoryTab();
    else if(activeTab === 'admin') renderAdminTab(content);
  }
  window.prSetTab = function(t){ activeTab = t; if(t !== 'admin') selectedRoundId = selectedRoundId || findOpenRoundId(); render(); };
  window.prLogout = function(){ session = { playerId:null, playerName:null, isAdmin:false }; loginMode='player'; clearSession(); render(); };

  let predictDraft = {};
  function initDraft(rnd){
    predictDraft = {};
    const myPreds = predictions[session.playerId] || {};
    rnd.matches.forEach(m => {
      const p = myPreds[m.id];
      predictDraft[m.id] = {
        outcome: p ? p.outcome || null : null,
        isExact: !!(p && p.exact),
        exactHome: p && p.exact ? p.exact.home : '',
        exactAway: p && p.exact ? p.exact.away : ''
      };
    });
  }
  function outcomeLabel(side, m){
    if(side === 'draw') return 'تعادل';
    return side === 'home' ? esc(m.home) : esc(m.away);
  }

  function renderPredictTab(){
    if(!rounds.length) return `<div class="pr-card"><div class="pr-empty">ما فيه جولات بعد — انتظر المنظم يضيف الجولة الأولى.</div></div>`;
    if(!selectedRoundId) selectedRoundId = findOpenRoundId();
    const roundChips = rounds.map(r => `<button class="pr-round-chip ${r.id===selectedRoundId?'active':''}" onclick="prSelectRound('${r.id}')">${toAr(esc(r.name))}</button>`).join('');
    const rnd = rounds.find(r => r.id === selectedRoundId) || rounds[0];
    const locked = isRoundLocked(rnd);

    if(locked){
      const rows = rnd.matches.map(m => {
        const allPicks = players.map(pl => {
          const pred = (predictions[pl.id] || {})[m.id];
          const isMe = pl.id === session.playerId;
          let txt = '—';
          if(pred && pred.outcome){
            txt = outcomeLabel(pred.outcome, m);
            if(pred.exact && pred.exact.home !== '' && pred.exact.home != null){
              txt += ` (🎯 ${toAr(pred.exact.home)}-${toAr(pred.exact.away)})`;
            }
          }
          return `<span style="display:inline-block;margin:3px 6px 3px 0;padding:3px 9px;border-radius:999px;font-size:12px;background:${isMe?'rgba(217,164,65,0.25)':'rgba(255,255,255,0.06)'};color:${isMe?'var(--gold-bright)':'var(--text-dim)'}">${esc(pl.name)}: ${txt}</span>`;
        }).join('');
        const realTxt = m.finished ? `${toAr(m.homeScore)} - ${toAr(m.awayScore)}` : '';
        return `<div style="padding:12px 6px;border-bottom:1px dashed rgba(255,255,255,0.08)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <b>${esc(m.home)} × ${esc(m.away)}</b>
            <span class="pr-match-time">${m.finished ? 'النتيجة: '+realTxt : fmtDT(m.kickoff)}</span>
          </div>
          <div>${allPicks || '<span class="pr-hint">محد توقع بعد</span>'}</div>
        </div>`;
      }).join('');
      const myScore = calcRoundScore(session.playerId, rnd);
      return `
        <div class="pr-round-select">${roundChips}</div>
        <div class="pr-card">
          <div class="pr-section-title">توقعات ${toAr(esc(rnd.name))} 🔒</div>

          ${rows}
        </div>`;
    }

    if(!predictDraftRoundId || predictDraftRoundId !== rnd.id){ initDraft(rnd); predictDraftRoundId = rnd.id; }

    const rows = rnd.matches.map(m => {
      const d = predictDraft[m.id] || { outcome:null, isExact:false, exactHome:'', exactAway:'' };
      const btn = (side, label) => `<button type="button" class="pr-outcome-btn ${d.outcome===side?'active':''}" onclick="prPickOutcome('${m.id}','${side}')">${label}</button>`;
      return `
      <div class="pr-match-predict">
        <div class="pr-flex-between" style="margin-bottom:8px">
          <b>${esc(m.home)} × ${esc(m.away)}</b>
          <span class="pr-match-time">${fmtDT(m.kickoff)}</span>
        </div>
        <div class="pr-outcome-row">
          ${btn('home', esc(m.home))}
          ${btn('draw', 'تعادل')}
          ${btn('away', esc(m.away))}
        </div>
        <label class="pr-exact-toggle">
          <input type="checkbox" ${d.isExact?'checked':''} onchange="prToggleExact('${m.id}', this.checked)">
          🎯 اختر هذي كمباراة النتيجة الدقيقة (نقطة بونص إضافية)
        </label>
        ${d.isExact ? `
        <div class="pr-score-box" style="margin-top:8px">
          <input type="text" inputmode="numeric" maxlength="2" value="${toAr(d.exactHome)}" oninput="prDigitInput(this); prSetExactVal('${m.id}','home',this.value)">
          <span class="pr-score-dash">–</span>
          <input type="text" inputmode="numeric" maxlength="2" value="${toAr(d.exactAway)}" oninput="prDigitInput(this); prSetExactVal('${m.id}','away',this.value)">
        </div>` : ''}
      </div>`;
    }).join('');
    return `
      <div class="pr-round-select">${roundChips}</div>
      <div class="pr-card">
        <div class="pr-section-title">مباريات ${toAr(esc(rnd.name))}</div>
        <div class="pr-hint" style="margin-bottom:10px">اختر فوز/تعادل/خسارة لكل مباراة. ٥ صحيحة أو أكثر = ٣ نقاط، ٨ أو أكثر = ٥ نقاط. اختر مباراة وحدة بس تكتب لها نتيجة دقيقة (بونص +١ منفصل). توقعاتك سرّية لين تبدأ أول مباراة بالجولة.</div>
        ${rows}
        <div style="margin-top:14px;display:flex;justify-content:flex-end">
          <button class="pr-btn" onclick="prSavePredictions('${rnd.id}')">حفظ التوقعات 💾</button>
        </div>
        <div id="predict-msg" class="pr-hint"></div>
      </div>`;
  }
  let predictDraftRoundId = null;
  window.prSelectRound = function(id){ selectedRoundId = id; predictDraftRoundId = null; render(); };
  window.prPickOutcome = function(matchId, side){
    if(!predictDraft[matchId]) predictDraft[matchId] = { outcome:null, isExact:false, exactHome:'', exactAway:'' };
    predictDraft[matchId].outcome = side;
    render();
  };
  window.prToggleExact = function(matchId, checked){
    if(checked){
      // only one match per round can be the exact pick — clear others
      Object.keys(predictDraft).forEach(id => { predictDraft[id].isExact = false; });
      predictDraft[matchId].isExact = true;
    } else {
      predictDraft[matchId].isExact = false;
    }
    render();
  };
  window.prSetExactVal = function(matchId, side, val){
    if(!predictDraft[matchId]) return;
    predictDraft[matchId][side === 'home' ? 'exactHome' : 'exactAway'] = toWest(val);
  };
  window.prSavePredictions = async function(roundId){
    const rnd = rounds.find(r => r.id === roundId);
    if(isRoundLocked(rnd)){ prToast('الجولة بدأت وانقفلت التوقعات', true); render(); return; }
    const missing = rnd.matches.some(m => !predictDraft[m.id] || !predictDraft[m.id].outcome);
    if(missing){ document.getElementById('predict-msg').textContent = 'اختر فوز/تعادل/خسارة لكل مباراة قبل الحفظ.'; return; }
    const mine = predictions[session.playerId] ? {...predictions[session.playerId]} : {};
    rnd.matches.forEach(m => {
      const d = predictDraft[m.id];
      const hasExact = d.isExact && d.exactHome !== '' && d.exactHome != null && d.exactAway !== '' && d.exactAway != null;
      mine[m.id] = {
        outcome: d.outcome,
        exact: hasExact ? { home: Number(d.exactHome), away: Number(d.exactAway) } : null
      };
    });
    predictions[session.playerId] = mine;
    const ok = await sSet('predictions', predictions);
    document.getElementById('predict-msg').textContent = ok ? 'تم حفظ توقعاتك ✅' : 'صار خطأ أثناء الحفظ، حاول مرة ثانية ⚠️';
  };

  function renderLeaderboardTab(){
    if(!players.length) return `<div class="pr-card"><div class="pr-empty">ما فيه لاعبين مسجلين بعد.</div></div>`;
    const standings = computeStandings();
    const medals = ['🥇','🥈','🥉'];
    const rows = standings.map((s,i) => `
      <tr class="${s.player.id===session.playerId?'pr-row-me':''}">
        <td class="pr-rank">${medals[i] || toAr(i+1)}</td>
        <td>${esc(s.player.name)}</td>
        <td class="pr-total">${toAr(s.total)}</td>
        <td>${toAr(s.exactBonusTotal)}</td>
        <td>${toAr(esc(s.bestRound))} (${toAr(s.bestVal)})</td>
      </tr>`).join('');
    return `<div class="pr-card">
      <div class="pr-section-title">🏅 الترتيب العام</div>
      <div style="overflow-x:auto"><table class="pr-table">
        <thead><tr><th></th><th>اللاعب</th><th>المجموع</th><th>بونص دقيق 🎯</th><th>أفضل جولة</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }

  function renderHistoryTab(){
    if(!rounds.length) return `<div class="pr-card"><div class="pr-empty">ما فيه جولات بعد.</div></div>`;
    return rounds.slice().reverse().map(rnd => {
      const myPreds = predictions[session.playerId] || {};
      const score = calcRoundScore(session.playerId, rnd);
      const rows = rnd.matches.map(m => {
        const pred = myPreds[m.id];
        const real = m.finished ? matchOutcome(m) : null;
        const realTxt = m.finished ? `${toAr(m.homeScore)} - ${toAr(m.awayScore)}` : 'لم تنتهِ بعد';
        const predTxt = pred && pred.outcome ? outcomeLabel(pred.outcome, m) : 'لا يوجد توقع';
        const correct = m.finished && pred && pred.outcome === real;
        const exactTxt = pred && pred.exact ? ` 🎯 ${toAr(pred.exact.home)}-${toAr(pred.exact.away)}` : '';
        const exactHit = m.finished && pred && pred.exact && Number(pred.exact.home) === m.homeScore && Number(pred.exact.away) === m.awayScore;
        const pill = !m.finished ? '' : correct ? `<span class="pr-pts-pill pr-pts-3">✅</span>` : `<span class="pr-pts-pill pr-pts-0">❌</span>`;
        const exactPill = exactHit ? `<span class="pr-pts-pill pr-pts-1">🎯 +١</span>` : '';
        return `<div class="pr-match" style="flex-wrap:wrap">
          <div style="flex:1;min-width:140px"><b>${esc(m.home)} × ${esc(m.away)}</b><div class="pr-match-time">النتيجة: ${realTxt}</div></div>
          <div style="text-align:left"><div class="pr-match-time">توقعك: ${predTxt}${exactTxt}</div>${pill}${exactPill}</div>
        </div>`;
      }).join('');
      return `<div class="pr-card">
        <div class="pr-flex-between"><div class="pr-section-title">${toAr(esc(rnd.name))}</div>
        <span style="color:var(--gold-bright);font-weight:700">${toAr(score.total)} نقطة</span></div>
        ${rows}
      </div>`;
    }).join('');
  }
